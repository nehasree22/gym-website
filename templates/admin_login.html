<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            background:#0f0f0f;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
        }

        .box{
            background:#1c1c1c;
            padding:30px;
            border-radius:12px;
            width:300px;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#d4af37;
            border:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Admin Login</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Admin Username" required>

        <input type="password" name="password" placeholder="Admin Password" required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
