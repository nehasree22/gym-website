<!DOCTYPE html>
<html>
<head>

<title>Member Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    padding:40px;
}

.header{
    margin-bottom:40px;
}

.header h1{
    color:#d4af37;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#171717;
    padding:30px;
    border-radius:20px;
    border:1px solid rgba(212,175,55,.2);
}

.card h2{
    color:#d4af37;
    margin-bottom:15px;
}

.card a{
    display:inline-block;
    margin-top:12px;
    padding:10px 15px;
    background:#d4af37;
    color:black;
    text-decoration:none;
    border-radius:8px;
    font-weight:600;
}

.bottom{
    margin-top:40px;
}

.bottom a{
    display:inline-block;
    margin-right:10px;
    padding:12px 25px;
    background:#d4af37;
    color:black;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
}

.alert{
    margin-bottom:20px;
    padding:15px;
    border-radius:10px;
    background:#222;
    border-left:5px solid #d4af37;
}

</style>

</head>

<body>

<div class="header">
    <h1>Welcome {{ username }}</h1>
    <p>Your Fitness Dashboard</p>
</div>

<div class="alert">
    {{ alert }}
</div>

<div class="cards">

    <div class="card">
        <h2>Membership</h2>
        <p>{{ plan }}</p>
    </div>

    <div class="card">
        <h2>Status</h2>
        <p>{{ status }}</p>
    </div>

    <div class="card">
        <h2>Expiry</h2>
        <p>{{ expiry }}</p>
    </div>

    <div class="card">
        <h2>Attendance</h2>
        <p>{{ attendance }} Days</p>
    </div>

    <div class="card">
        <h2>Workout</h2>
        <p>{{ workout }}</p>
    </div>

    <div class="card">
        <h2>Diet</h2>
        <p>{{ diet }}</p>
    </div>

    <div class="card">
        <h2>Payment</h2>
        <p>₹999 Membership</p>
        <a href="/pay">Pay Now 💳</a>
    </div>

    <div class="card">
        <h2>BMI</h2>
        <a href="/bmi">Open Calculator</a>
    </div>

</div>

<div class="bottom">
    <a href="/">Back To Home</a>
    <a href="/logout">Logout</a>
</div>

</body>
</html>
